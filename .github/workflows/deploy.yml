name: Build and Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'backend/dist/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Commit and push dist
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add backend/dist/ -f
          git diff --staged --quiet && echo "No changes" || git commit -m "build: update backend/dist [skip ci]"
          git push origin main
